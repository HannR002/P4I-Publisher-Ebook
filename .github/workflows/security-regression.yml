name: Security and financial regression
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  repository-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/check_repository_security.py
      - run: python3 -m unittest discover -s tests/security -v
  laravel:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_DATABASE: p4i_security_test
          MARIADB_USER: p4i_test
          MARIADB_PASSWORD: isolated-test-only
          MARIADB_ROOT_PASSWORD: isolated-root-test-only
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, curl, pdo_sqlite, pdo_mysql, gd, zip
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: composer validate --strict
      - run: composer audit
      - run: git diff --name-only --diff-filter=ACM origin/master...HEAD -- '*.php' | xargs -r vendor/bin/pint --test
      - run: php artisan test --compact
      - run: php artisan test --compact
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_DATABASE: p4i_security_test
          DB_USERNAME: p4i_test
          DB_PASSWORD: isolated-test-only
          DB_SOCKET: ''
          P4I_MYSQL_CONCURRENCY: '1'
      - run: npm ci && npm audit && npm run build
